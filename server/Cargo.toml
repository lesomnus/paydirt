[package]
name = "paydirt-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[dependencies]
paydirt = {path="..",features=["watch-postgres"]}
axum = {version="0.8",default-features=false,features=["tokio","http1","http2"]}
connectrpc = {version="=0.8.2",default-features=false,features=["server","json"]}
serde = {version="1",features=["derive"]}
hyper = {version="1",features=["server","http1","http2"]}
hyper-util = {version="0.1",features=["server-auto","tokio","service"]}
tower = {version="0.5",features=["util"]}
tower-http = {version="0.6",features=["cors"]}
tokio = {version="1",features=["net","macros","time","rt","sync"]}
tokio-rustls = "0.26"
rustls-pemfile = "2"
sha2 = "0.10"
hex = "0.4"
opentelemetry = {version="0.32",default-features=false,features=["trace"]}
opentelemetry_sdk = {version="0.32",default-features=false,features=["trace"]}
opentelemetry-otlp = {version="0.32",default-features=false,features=["http-proto","trace","reqwest-blocking-client","reqwest-rustls"]}
jsonwebtoken={version="12",default-features=false,features=["aws_lc_rs"]}
reqwest={version="0.13",default-features=false,features=["rustls","json"]}
chrono={version="0.4",features=["serde"]}
serde_json="1"
base64="0.22"
