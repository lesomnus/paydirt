[package]
name = "paydirt-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lesomnus/paydirt"

[[bin]]
name = "paydirt"
path = "src/main.rs"

[dependencies]
tempfile = "3"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit-mut", "visit"] }
quote = "1"
heck = "0.5"
prettyplease = "0.2"
paydirt-model = { path = "../model" }
toml_edit = "0.23"
semver = "1"
