[package]
name = "paydirt-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lesomnus/paydirt"

[[bin]]
name = "paydirt"
path = "src/main.rs"

[dependencies]
tempfile = "3"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
prettyplease = "0.2"
