edition = "2023";
package app;
import "orm.proto";
import "payday.proto";

option go_package = "example.org/app";
option features.field_presence = IMPLICIT;

// A public read-only setting that identifies this deployment.
message Setting {
  option (orm.message) = {rpc: {get: {}}};
  option (payday.entity) = {domain: 7, global: {}, trail: {off: {why: "Read-only deployment configuration"}}, erase: {hard: {}}};
  bytes id = 1 [(orm.field) = {type: TYPE_UUID, key: true}];
  string alias = 4 [(orm.field) = {unique: true}];
  string value = 8;
}
