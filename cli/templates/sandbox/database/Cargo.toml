[package]
name = "paydirt-app-database"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
[lib]
crate-type = ["cdylib"]

[dependencies]
paydirt-store = {git="https://github.com/lesomnus/paydirt",rev="77a2313a30cacb4f638ad716e743f4a4254c5aa9",features=["sqlite"]}
sqlite-wasm-rs = {version="=0.6.3",features=["wasm-bindgen"]}
sqlite-wasm-vfs = {version="0.3",features=["sahpool"]}
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
serde_json = "1"
base64 = "0.22"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
