edition = "2023";
package app;
import "app/payday/tenant.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";
option go_package = "github.com/lesomnus/payday/internal/apptest";
option features.field_presence = IMPLICIT;

// Focused test entities using the same wire names and domains as Payday's apptest.
message Cell {
  option (orm.message) = {rpc: {crud: true}};
  option (payday.entity) = {domain: 10};
  bytes id = 1 [(orm.field) = {type: TYPE_UUID, key: true, default: ""}];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];
  string alias = 4;
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
}

message Robot {
  option (orm.message) = {
    rpc: {crud: true, add: {many: {}}}
    indexes: [
      {name: "slug", unique: true, refs: [{name: "alias", number: 4}, {name: "tenant", number: 2}]},
      {name: "page", refs: [{name: "tenant", number: 2}, {name: "date_created", number: 15}, {name: "id", number: 1}]},
      {name: "by_alias", refs: [{name: "tenant", number: 2}, {name: "alias", number: 4}, {name: "id", number: 1}]}
    ]
  };
  option (payday.entity) = {
    domain: 7
    list: {
      order: [{field: {name: "date_created"}}, {field: {name: "id"}}]
      with: [{name: "tenant"}]
      by: [{name: "ref"}, {name: "tenant"}]
      size: 50, max: 100
      orders: [
        {name: "alias", order: [{field: {name: "alias"}}, {field: {name: "id"}}]},
        {name: "alias_desc", order: [{field: {name: "alias"}, desc: true}, {field: {name: "id"}}]}
      ]
    }
    watch: {}
  };
  bytes id = 1 [(orm.field) = {type: TYPE_UUID, key: true, default: ""}];
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];
  Cell cell = 3 [(orm.edge) = {nullable: true}];
  string alias = 4;
  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {immutable: true, default: ""}];
}
