message RobotRenamePairRequest {
  RobotRef first = 1;
  string first_alias = 2;
  RobotRef second = 3;
  string second_alias = 4;
  bytes proof = 5;
}

message RobotAllowanceRequest { string key=1; bool lock=2; }
message RobotAllowanceResponse { bool enabled=1; bool allows_two=2; }
message InvitationCount { int32 mine = 1; int32 selected = 2; }
