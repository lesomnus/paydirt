[package]
name = "paydirt-storage"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
paydirt-robot-protocol = { path = "../robot/protocol" }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
diesel = { version = "=2.3.14", default-features = false, features = ["postgres"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
diesel = { version = "=2.3.14", default-features = false, features = ["sqlite"] }
sqlite-wasm-rs = { version = "=0.6.3", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3", features = ["sahpool"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
