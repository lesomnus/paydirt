name: cli
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  external-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: paydirt
          POSTGRES_DB: paydirt
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
          github_token: ${{ github.token }}
      - name: Install code generators
        run: |
          scripts/install-codegen-linux.sh "$RUNNER_TEMP/paydirt-tools"
          echo "$RUNNER_TEMP/paydirt-tools" >> "$GITHUB_PATH"
      - run: cargo build --locked -p paydirt-cli
      - run: target/debug/paydirt gen --check
      - run: scripts/upstream.sh && python3 scripts/test-payday-contracts.py
      - run: scripts/test-gen.sh && scripts/test-new.sh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/app-target
      - name: Install browser and Worker build tools
        run: |
          rustup target add wasm32-unknown-unknown
          archive=wasm-bindgen-0.2.130-x86_64-unknown-linux-musl
          curl -fsSLo "$RUNNER_TEMP/$archive.tgz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/$archive.tar.gz"
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  $RUNNER_TEMP/$archive.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
          npm ci --prefix web
          (cd web && npx playwright install --with-deps chromium)
      - uses: actions/checkout@v4
        with:
          repository: lesomnus/payday
          ref: 53acc135cc084adafda524e882f19275c0d0cc96
          path: upstream-go
      - name: Build the pinned Go reference server
        working-directory: upstream-go
        run: go build -o "$RUNNER_TEMP/payday-reference" ./internal/apptest/testsrv
      - run: scripts/test-generated-cell.sh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/app-target
          PAYDIRT_TEST_WASM: "1"
          PAYDIRT_GO_REFERENCE: ${{ runner.temp }}/payday-reference
          DATABASE_URL: postgres://postgres:paydirt@127.0.0.1:5432/paydirt
      - run: scripts/test-upgrades.sh
        env:
          DATABASE_URL: postgres://postgres:paydirt@127.0.0.1:5432/paydirt
