name: cli
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  external-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: paydirt
          POSTGRES_DB: paydirt
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
          github_token: ${{ github.token }}
      - name: Install code generators
        run: |
          scripts/install-codegen-linux.sh "$RUNNER_TEMP/paydirt-tools"
          echo "$RUNNER_TEMP/paydirt-tools" >> "$GITHUB_PATH"
      - run: cargo build --locked -p paydirt-cli
      - run: target/debug/paydirt gen --check
      - run: scripts/upstream.sh && python3 scripts/test-payday-contracts.py
      - run: scripts/test-gen.sh && scripts/test-new.sh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/app-target
      - run: npm ci --prefix web && scripts/test-generated-cell.sh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/app-target
          DATABASE_URL: postgres://postgres:paydirt@127.0.0.1:5432/paydirt
