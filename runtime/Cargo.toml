[package]
name = "paydirt-store"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
resource-cel=["dep:cel"]

workers = ["dep:tokio","dep:tempfile","paydirt/watch-postgres"]
postgres = ["diesel/postgres"]
sqlite = ["diesel/sqlite"]

[dependencies]
buffa-reflect={version="0.9.2",default-features=false,features=["serde"]}

paydirt = { path = ".." }
paydirt-model = { path = "../model" }
diesel = { version = "=2.3.14", default-features = false }
base64 = "0.22"
hex = "0.4"
hmac="0.12"
subtle="2.6"
sha2="0.10"
getrandom={version="0.4",features=["wasm_js"]}
heck = "0.5"
chrono = { version = "0.4", features = ["wasmbind","serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = {version="1",features=["raw_value"]}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ring="0.17"
flate2="1"
spki={version="0.7",features=["std"]}
cel={version="0.16",optional=true,default-features=false}
tokio = {version="1",features=["macros","time"],optional=true}
tempfile = {version="3",optional=true}

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"
tokio = { version="1", features=["macros","rt"] }
