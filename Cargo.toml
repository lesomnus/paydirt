[workspace]
members = ["cli", "model", "runtime", "robot", "robot/protocol", "storage", "pdtest"]
resolver = "3"

[package]
name = "paydirt"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust runtime for Payday applications"
repository = "https://github.com/lesomnus/paydirt"

[features]
watch-postgres = ["dep:tokio-postgres", "dep:tokio"]
watch-nats = ["dep:bytes", "dep:async-nats", "dep:tokio"]

[dependencies]
futures-util = "0.3"
futures-channel = "0.3"
async-stream = "0.3"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v7", "js"] }

serde = {version="1",features=["derive"]}

[target.'cfg(not(target_arch="wasm32"))'.dependencies]
serde_yaml="0.9"
tokio-postgres = { version = "0.7", optional = true }
bytes = { version = "1", optional = true }
async-nats = { version = "0.46", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "sync", "time", "macros"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

[dev-dependencies]
tokio = {version="1",features=["macros","rt","time","net","io-util"]}
